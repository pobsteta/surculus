name: Badges

# Badge de couverture JaCoCo (:core et :gpkg), publié sur la branche dédiée « badges ».
# Jamais sur main. Deux jobs : celui qui exécute le code du dépôt est en lecture seule ;
# celui qui a le droit d'écrire n'exécute aucun code du dépôt, il ne fait que pousser le SVG.
on:
  push:
    branches: [ main ]

permissions: {}

concurrency:
  group: badges
  cancel-in-progress: false

jobs:
  couverture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurer JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurer le SDK Android
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Tests et couverture (:core, :gpkg)
        run: ./gradlew :core:test :gpkg:test :core:jacocoTestReport :gpkg:jacocoTestReport --no-daemon

      - name: Générer le badge de couverture
        uses: cicirello/jacoco-badge-generator@72266185b7ee48a6fd74eaf0238395cc8b14fef8 # v2.12.1
        with:
          jacoco-csv-file: |
            core/build/reports/jacoco/jacoco.csv
            gpkg/build/reports/jacoco/jacoco.csv
          badges-directory: badges-sortie
          generate-coverage-badge: true
          coverage-badge-filename: jacoco.svg

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: badge-couverture
          path: badges-sortie/jacoco.svg
          if-no-files-found: error

  publier:
    needs: couverture
    runs-on: ubuntu-latest
    # Seul droit d'écriture du workflow ; la seule cible est la branche « badges ».
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: badge-couverture
          path: sortie

      # Poussée ordinaire (jamais forcée) : l'historique de la branche badges est conservé.
      - name: Pousser le SVG sur la branche badges
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
        run: |
          URL="https://x-access-token:${GH_TOKEN}@github.com/${DEPOT}.git"
          if git ls-remote --exit-code --heads "$URL" badges > /dev/null; then
            git clone -q --branch badges --depth 1 "$URL" depot
          else
            git init -q -b badges depot
          fi
          cp sortie/jacoco.svg depot/jacoco.svg
          cd depot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jacoco.svg
          if git diff --cached --quiet; then
            echo "Badge inchangé."
          else
            git commit -q -m "docs: badge de couverture"
            git push "$URL" badges:refs/heads/badges
          fi
