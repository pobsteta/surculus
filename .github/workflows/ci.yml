name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Lecture seule : la CI ne pousse jamais sur main.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurer JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurer le SDK Android
        uses: android-actions/setup-android@v3
        with:
          # build-tools fournit zipalign pour le contrôle 16 Ko.
          packages: platform-tools build-tools;36.0.0

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Commande de tests du projet (.claude/test-command)
        # La commande est lue dans le fichier, seule source (ADR 0004).
        run: sh -c "$(cat .claude/test-command) --no-daemon"

      - name: Contrôle des pages de 16 Ko (zipalign -P 16 et ELF)
        run: bash scripts/verifier-16ko.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK de debug
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
