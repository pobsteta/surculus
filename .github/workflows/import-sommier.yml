name: Import sommieR

# Mission 007, ADR 0007 (« Critère de CI ») : rejouer
# sommier_importer_qfield_travaux() de sommieR 0.31.1 sur une tournée, contre
# une vraie base PostGIS, puis mesurer F1, F2 et F3 (mission 026). Voir
# ci/sommier/README.md.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Lecture seule : ce travail ne pousse jamais sur main.
permissions:
  contents: read

env:
  # Mot de passe d'un service éphémère, détruit avec le job ; il ne protège
  # rien. Défini ici une seule fois ; aucun autre mot de passe n'entre dans le
  # dépôt.
  SOMMIER_CI_PASSWORD: ci-ephemere

concurrency:
  group: import-sommier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import-sommier:
    name: import sommieR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: ${{ env.SOMMIER_CI_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # sommieR 0.31.1 : tag v0.31.1, qui désigne le commit ci-dessous. On
      # installe par le commit, qu'un tag déplacé ne peut pas changer.
      SOMMIER_TAG: v0.31.1
      SOMMIER_COMMIT: fd92078e9f538aefbf1181cae7e88f64a5f8961d
      SOMMIER_CI_HOST: localhost
      SOMMIER_CI_PORT: 5432
      SOMMIER_CI_USER: postgres
      # Emplacement de l'export Surculus décompressé (mission 006), voir
      # ci/sommier/README.md.
      EXPORT_SURCULUS: ci/sommier/export-surculus

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurer R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Bibliothèques système (sf, RPostgres)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev \
            libudunits2-dev libsqlite3-dev libpq-dev libssl-dev \
            libcurl4-openssl-dev libxml2-dev

      - name: Paquets R
        env:
          # Sans jeton, remotes utilise son PAT intégré, refusé par l'API
          # GitHub. Le jeton du job est en lecture seule (contents: read).
          GITHUB_PAT: ${{ github.token }}
        run: |
          # `tibble` : sommieR l'appelle via sf::read_sf() mais ne le déclare
          # pas (ni Imports ni Suggests) ; `dependencies = FALSE` plus bas le
          # masque, d'où son installation explicite ici.
          install.packages(c("remotes", "DBI", "RPostgres", "RSQLite", "sf",
                             "jsonlite", "withr", "xml2", "openssl", "tibble"))
          # Les suggestions de sommieR (dont nemeton) ne servent pas ici.
          remotes::install_github(
            "pobsteta/sommieR", ref = Sys.getenv("SOMMIER_COMMIT"),
            dependencies = FALSE, upgrade = "never")
          v <- as.character(packageVersion("sommieR"))
          if (v != "0.31.1") stop("sommieR ", v, " installé, 0.31.1 attendu")
        shell: Rscript {0}

      - name: Vérifier que la base répond
        run: |
          Rscript -e 'con <- DBI::dbConnect(RPostgres::Postgres(), host = "localhost", dbname = "postgres", user = "postgres", password = Sys.getenv("SOMMIER_CI_PASSWORD")); DBI::dbExecute(con, "CREATE EXTENSION IF NOT EXISTS postgis"); print(DBI::dbGetQuery(con, "SELECT postgis_version()"))'

      - name: Préparer la démo Couchey et la tournée de départ
        run: Rscript ci/sommier/verifier.R --sortie ci/sommier/sortie --etape preparer

      # Mission 022 : JDK 21, comme la CI de l'application (ci.yml).
      - name: Configurer JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # Surculus part de la tournée de CE job (ses UUID de forêt et de placettes
      # sont propres à cette exécution), joue le scénario Couchey et écrit
      # l'export décompressé dans $EXPORT_SURCULUS (= <sortie>/export-surculus).
      - name: Exporter la tournée avec Surculus (scénario Couchey)
        run: |
          ./gradlew :gpkg:exporterScenario --no-daemon \
            -Ptournee=ci/sommier/sortie/tournee-depart \
            -Pscenario=fixtures/export/scenario-couchey.json \
            -Psortie=ci/sommier

      - name: TEMPORAIRE 026 sabotage
        run: |
          Rscript -e 'db <- DBI::dbConnect(RSQLite::SQLite(), "ci/sommier/export-surculus/travaux.gpkg"); print(DBI::dbGetQuery(db, "SELECT count(*) AS controles FROM controles")); DBI::dbExecute(db, "UPDATE placettes SET code_placette = code_placette || 'x' WHERE rowid = (SELECT min(rowid) FROM placettes)")'

      # Mission 026 : F1, F2 et F3 remplacent la comparaison « avec / sans »
      # (ancien critère (a)). Le détail est dans ci/sommier/README.md.
      - name: Tester les fonctions des critères F1, F2 et F3
        run: Rscript ci/sommier/test-criteres.R

      - name: Rejouer l'import et mesurer F1, F2 et F3
        run: |
          # L'export et son bilan sont obligatoires : leur absence est un
          # échec, jamais un vert partiel.
          for f in "$EXPORT_SURCULUS/travaux.gpkg" ci/sommier/bilan-export.json; do
            if [ ! -f "$f" ]; then
              echo "::error title=Export Surculus absent::$f n'a pas été produit par :gpkg:exporterScenario."
              exit 1
            fi
          done
          Rscript ci/sommier/verifier.R --sortie ci/sommier/sortie \
            --etape comparer --avec "$EXPORT_SURCULUS" \
            --bilan-export ci/sommier/bilan-export.json

      # Le résumé est écrit par verifier.R, même en cas d'écart.
      - name: Résumé du job (F1, F2, F3)
        if: always()
        run: |
          if [ -f ci/sommier/sortie/resume.md ]; then
            cat ci/sommier/sortie/resume.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Aucun résumé : le script n'a pas atteint les critères." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publier les bilans
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bilans-import-sommier
          path: |
            ci/sommier/sortie/bilan-*.json
            ci/sommier/sortie/resume.md
            ci/sommier/bilan-export.json
            ci/sommier/export-surculus.zip
          if-no-files-found: ignore
