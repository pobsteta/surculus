name: Release

# Chaque fusion dans main : version SemVer calculée depuis les commits conventionnels,
# tests et contrôle 16 Ko, APK release, puis tag vX.Y.Z et release GitHub.
# Repris de Marculus (arbitrage de Pascal, 2026-10-16), avec une garde en plus : le tag
# n'est créé qu'après des tests verts (calcul en « dry_run », tag posé par la release).
on:
  push:
    branches: [ main ]

# Seul ce workflow écrit (tag et release). Il ne pousse aucun commit : jamais sur main.
permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # feat: -> mineur · fix: -> patch · ! ou BREAKING CHANGE -> majeur · sinon -> patch.
      - name: Calculer la version (sans poser le tag)
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          tag_prefix: v
          dry_run: true

      - name: Configurer JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurer le SDK Android
        uses: android-actions/setup-android@v3
        with:
          # build-tools fournit zipalign pour le contrôle 16 Ko.
          packages: platform-tools build-tools;36.0.0

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4

      # La release ne part que si ces deux contrôles sont verts.
      - name: Commande de tests du projet (.claude/test-command)
        run: sh -c "$(cat .claude/test-command) --no-daemon"

      - name: Préparer la clé de signature release
        id: cle
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signature=release" >> "$GITHUB_OUTPUT"
            echo "Clé release détectée : APK signé release (mises à jour possibles)."
          else
            echo "signature=debug" >> "$GITHUB_OUTPUT"
            echo "Secret RELEASE_KEYSTORE_BASE64 absent : repli sur la signature debug."
          fi

      - name: Compiler l'APK release
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >
          ./gradlew :app:assembleRelease --no-daemon
          -PappVersionName=${{ steps.tag.outputs.new_version }}
          -PappVersionCode=${{ github.run_number }}

      - name: Contrôle des pages de 16 Ko (APK release)
        run: bash scripts/verifier-16ko.sh app/build/outputs/apk/release/app-release.apk

      - name: Nommer l'APK et écrire les notes
        id: apk
        env:
          TAG: ${{ steps.tag.outputs.new_tag }}
          SIGNATURE: ${{ steps.cle.outputs.signature }}
          CHANGELOG: ${{ steps.tag.outputs.changelog }}
        run: |
          NAME="surculus-${TAG}-$(date -u +%Y%m%d-%H%M).apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          {
            printf '%s\n\n' "$CHANGELOG"
            if [ "$SIGNATURE" = "debug" ]; then
              echo "> **APK signé avec la clé de debug** (aucune clé release configurée)."
              echo "> Il ne se mettra pas à jour par-dessus un APK signé release : désinstaller d'abord."
            else
              echo "> APK signé avec la clé release."
            fi
          } > notes.md

      - name: Créer le tag et la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          target_commitish: ${{ github.sha }}
          name: Surculus ${{ steps.tag.outputs.new_tag }}
          body_path: notes.md
          files: ${{ steps.apk.outputs.name }}
