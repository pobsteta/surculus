# Catalogue des versions de Surculus (mission 001).
# Sources :
# - Kotlin, compose-compiler 2.4.21 et AGP 9.4.1 : groma/android/build.gradle.kts (l. 12, 18-19),
#   arbitrage de Pascal du 2026-10-16.
# - Gradle 9.8.1 (gradle/wrapper/gradle-wrapper.properties) : AGP 9.4.1 exige Gradle >= 9.6.0 ;
#   9.8.1 est la version que Groma emploie avec AGP 9.4.1 (groma/.github/workflows/ci.yml l. 47).
# - KSP 2.3.12 : dernière version publiée (Maven Central, symbol-processing-gradle-plugin,
#   maven-metadata.xml, publiée le 2026-09-09) ; depuis KSP 2.3.0 la version de KSP n'est plus
#   indexée sur celle de Kotlin.
# - Compose BOM, AndroidX, Room, DataStore, osmdroid, coroutines : marculus/gradle/libs.versions.toml.
# - desugar_jdk_libs 2.1.5 : Google Maven, com/android/tools/desugar_jdk_libs/maven-metadata.xml (release, 2026-10-17), exigé par sqlite-jdbc sur Android (USAGE.md).
# - androidx.test.ext:junit 1.3.0 et androidx.test:runner 1.7.0 : Google Maven, maven-metadata.xml (dernières versions stables, 2026-10-17), essai de fumée de la release.
# - JUnit Jupiter 6.1.3 et sqlite-jdbc 3.53.4.0 : groma/android/groma-core/build.gradle.kts.
# - vosk-android 0.3.75 : ADR 0004 ; JNA 5.18.1 : POM de vosk-android 0.3.75 (Maven Central).
# - Gson 2.14.0 : Maven Central (com.google.code.gson:gson, release du maven-metadata.xml), lecteur JSON des tests de fixtures (mission 002).
# - Robolectric 4.17, androidx.test:core 1.7.0, room-testing : marculus/gradle/libs.versions.toml (mission 008, tests du journal Room) ; JUnit 4.13.2 : requis par Robolectric.

[versions]
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
composeBom = "2026.02.01"
room = "2.8.1"
datastore = "1.1.1"
osmdroid = "6.1.20"
sqliteJdbc = "3.53.4.0"
desugarJdkLibs = "2.1.5"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
activityCompose = "1.8.2"
lifecycle = "2.9.4"
coreKtx = "1.16.0"
coroutines = "1.10.2"
vosk = "0.3.75"
jna = "5.18.1"
junitJupiter = "6.1.3"
gson = "2.14.0"
robolectric = "4.17"
androidxTestCore = "1.7.0"
junit4 = "4.13.2"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
